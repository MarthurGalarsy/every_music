<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <th:block th:replace="~{fragments/seo :: meta('Every Music | 作曲と演奏投稿でつながる音楽コラボアプリ', 'Every Musicは、作曲したコード進行に演奏を重ね、いいね・コメント・フォロー・ランキングで音楽仲間と広がるコラボ音楽アプリです。', 'website', ${publicBaseUrl})}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #f6f7fb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2c3e50;
        }
        header {
            background-color: #ffffff;
            padding: 20px 16px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #f39c12;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .top-shell {
            max-width: 1120px;
            margin: 34px auto;
            padding: 0 16px;
        }
        .hero-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(320px, 400px);
            gap: 24px;
            align-items: start;
        }
        .hero-copy,
        .login-container {
            background-color: #ffffff;
            border: 1px solid #eadfca;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .hero-copy {
            overflow: hidden;
            padding: 0;
        }
        .hero-body {
            display: grid;
            grid-template-columns: minmax(0, 0.9fr) minmax(300px, 1.1fr);
            gap: 30px;
            align-items: center;
            padding: 36px;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #f0dfbd;
            border-radius: 999px;
            background-color: #fffaf0;
            color: #b95d00;
            font-size: 0.88rem;
            font-weight: 700;
            padding: 7px 12px;
            margin-bottom: 14px;
        }
        .hero-copy h1 {
            font-size: 2.08rem;
            line-height: 1.28;
            font-weight: 700;
            margin-bottom: 16px;
            color: #2c3e50;
        }
        .hero-copy h1 span {
            display: block;
        }
        .hero-lead {
            font-size: 1rem;
            line-height: 1.85;
            color: #495057;
            margin-bottom: 18px;
        }
        .keyword-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
        }
        .keyword-strip span {
            border: 1px solid #f0dfbd;
            border-radius: 999px;
            background-color: #fffaf0;
            color: #b95d00;
            font-size: 0.86rem;
            font-weight: 700;
            padding: 6px 10px;
        }
        .session-preview {
            background-color: #223142;
            border-radius: 14px;
            color: #ffffff;
            padding: 18px;
            box-shadow: 0 14px 28px rgba(34, 49, 66, 0.24);
        }
        .preview-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .preview-dots {
            display: flex;
            gap: 5px;
        }
        .preview-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f39c12;
        }
        .preview-dots span:nth-child(2) {
            background-color: #48c9b0;
        }
        .preview-dots span:nth-child(3) {
            background-color: #5dade2;
        }
        .preview-bpm {
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            color: #dce7ef;
            font-size: 0.78rem;
            padding: 3px 8px;
        }
        .chord-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 18px;
        }
        .chord-cell {
            border-radius: 8px;
            background-color: #fff7e2;
            color: #b95d00;
            font-weight: 800;
            text-align: center;
            padding: 10px 0;
        }
        .track-list {
            display: grid;
            gap: 12px;
        }
        .track-row {
            display: grid;
            grid-template-columns: 58px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
        }
        .track-label {
            color: #dce7ef;
            font-size: 0.78rem;
            font-weight: 700;
        }
        .wave {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 28px;
        }
        .wave span {
            display: block;
            width: 11px;
            border-radius: 999px;
            background-color: #f39c12;
        }
        .wave span:nth-child(1) { height: 12px; }
        .wave span:nth-child(2) { height: 22px; background-color: #48c9b0; }
        .wave span:nth-child(3) { height: 16px; background-color: #5dade2; }
        .wave span:nth-child(4) { height: 26px; }
        .wave span:nth-child(5) { height: 18px; background-color: #48c9b0; }
        .wave span:nth-child(6) { height: 24px; background-color: #5dade2; }
        .preview-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            color: #dce7ef;
            font-size: 0.78rem;
        }
        .flow-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0;
            margin: 0;
            padding: 18px 36px;
            border-top: 1px solid #f0dfbd;
            background-color: #fffaf0;
        }
        .flow-item {
            display: grid;
            grid-template-columns: 30px minmax(0, 1fr);
            gap: 9px;
            align-items: center;
            padding: 0 12px;
        }
        .flow-item + .flow-item {
            border-left: 1px solid #f0dfbd;
        }
        .flow-step {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background-color: #f39c12;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .flow-title {
            display: block;
            color: #2c3e50;
            font-weight: 700;
            font-size: 0.94rem;
        }
        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }
        .login-container {
            padding: 30px;
        }
        h2 {
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
            color: #2c3e50;
        }
        .login-message {
            color: #6c757d;
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 26px;
            text-align: center;
        }
        .form-control {
            border-radius: 10px;
        }
        .btn-primary {
            width: 100%;
            border-radius: 10px;
        }
        .register-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #34495e;
            font-weight: 500;
        }
        @media (max-width: 576px) {
            body {
                background-color: #f4f6f8;
            }
            header {
                font-size: 22px;
                line-height: 1.35;
                padding: 18px 12px;
            }
            .top-shell {
                margin: 20px auto;
                padding: 0 12px;
            }
            .hero-layout {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .hero-copy,
            .login-container {
                padding: 20px;
                border-radius: 12px;
            }
            .hero-copy {
                padding: 0;
            }
            .hero-body {
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 20px;
            }
            .hero-copy h1 {
                font-size: 1.45rem;
            }
            .hero-lead {
                font-size: 0.95rem;
            }
            .flow-strip {
                grid-template-columns: 1fr;
                padding: 0 20px 20px;
                background-color: #ffffff;
                border-top: 0;
                gap: 10px;
            }
            .flow-item {
                border: 1px solid #f0dfbd;
                border-radius: 8px;
                background-color: #fffaf0;
                padding: 12px;
            }
            .flow-item + .flow-item {
                border-left: 1px solid #f0dfbd;
            }
            h2 {
                margin-bottom: 20px;
            }
            .form-control,
            .btn-primary {
                min-height: 44px;
            }
        }
    </style>
</head>
<body>
<header>
    みんなで音楽！Every Music
</header>
<main class="top-shell">
    <div class="hero-layout">
        <section class="hero-copy">
            <div class="hero-body">
                <div>
                    <div class="hero-badge">作曲 × 演奏投稿 × コラボ</div>
                    <h1><span>作った曲に、</span><span>演奏が重なる。</span></h1>
                    <p class="hero-lead">
                        Every Musicは、コード進行を投稿して、さまざまな楽器やパートの演奏を集める音楽コラボアプリです。
                    </p>
                    <div class="keyword-strip" aria-label="Every Musicの特徴">
                        <span>いいね</span>
                        <span>コメント</span>
                        <span>フォロー</span>
                        <span>ランキング</span>
                    </div>
                    <div class="hero-actions">
                        <a class="btn btn-warning" th:href="@{/member/register}">無料ではじめる</a>
                        <a class="btn btn-outline-secondary" th:href="@{/introduction}">使い方を見る</a>
                    </div>
                </div>

                <div class="session-preview" aria-label="コード進行と演奏トラックのプレビュー">
                    <div class="preview-head">
                        <div class="preview-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <span class="preview-bpm">BPM 120</span>
                    </div>
                    <div class="chord-row">
                        <div class="chord-cell">C</div>
                        <div class="chord-cell">G</div>
                        <div class="chord-cell">Am</div>
                        <div class="chord-cell">F</div>
                    </div>
                    <div class="track-list">
                        <div class="track-row">
                            <span class="track-label">Part A</span>
                            <div class="wave"><span></span><span></span><span></span><span></span><span></span><span></span></div>
                        </div>
                        <div class="track-row">
                            <span class="track-label">Part B</span>
                            <div class="wave"><span></span><span></span><span></span><span></span><span></span><span></span></div>
                        </div>
                        <div class="track-row">
                            <span class="track-label">Part C</span>
                            <div class="wave"><span></span><span></span><span></span><span></span><span></span><span></span></div>
                        </div>
                    </div>
                    <div class="preview-footer">
                        <span>4 tracks</span>
                        <span>Like 18 / Comment 6</span>
                    </div>
                </div>
            </div>
            <div class="flow-strip" aria-label="Every Musicの使い方">
                <div class="flow-item">
                    <span class="flow-step">1</span>
                    <span class="flow-title">コード進行を投稿</span>
                </div>
                <div class="flow-item">
                    <span class="flow-step">2</span>
                    <span class="flow-title">演奏を録音・投稿</span>
                </div>
                <div class="flow-item">
                    <span class="flow-step">3</span>
                    <span class="flow-title">同時再生でコラボ</span>
                </div>
            </div>
        </section>

        <section class="login-container">
            <h2>ログイン</h2>
            <p class="login-message">おかえりなさい。続きを作りにいきましょう。</p>
            <form id="login-form">
                <div class="mb-3">
                    <label for="mailAddress" class="form-label">メールアドレス</label>
                    <input type="email" class="form-control" id="mailAddress" name="mailAddress" required />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">パスワード</label>
                    <input type="password" class="form-control" id="password" name="password" required />
                </div>
                <button type="submit" class="btn btn-primary">ログイン</button>
            </form>
            <a class="register-link" th:href="@{/introduction}">使い方はこちら</a>
            <div id="error-message" class="alert alert-danger mt-3 d-none"></div>
        </section>
    </div>
</main>

<script>
    $("#login-form").on("submit", function(e) {
        e.preventDefault();
        $.post("/api/member/login", $(this).serialize())
            .done(data => window.location.href = data.redirect)
            .fail(err => {
                $("#error-message").text(err.responseJSON.message).removeClass("d-none");
            });
    });
</script>
</body>
</html>
