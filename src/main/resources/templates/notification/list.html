<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>通知</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .page-shell {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 16px;
        }
        .notification-panel {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 24px;
        }
        .notification-item {
            border-bottom: 1px solid #e9ecef;
            padding: 1rem 0;
            cursor: pointer;
        }
        .notification-item:last-child {
            border-bottom: none;
        }
        .notification-item.unread .notification-message {
            font-weight: 600;
        }
        .notification-message {
            word-break: break-word;
        }
        .empty-message {
            color: #6c757d;
            border: 1px dashed #ced4da;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="page-shell">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">通知</h2>
        <div class="d-flex gap-2">
            <button type="button" id="read-all-button" class="btn btn-outline-secondary">すべて既読</button>
            <a class="btn btn-outline-dark" th:href="@{/song/list}">曲一覧へ</a>
        </div>
    </div>

    <div class="notification-panel">
        <div id="notification-list"></div>
    </div>
</div>

<script>
    $(function () {
        function formatDate(value) {
            return (value || '').toString().replace('T', ' ').slice(0, 16);
        }

        function renderNotifications(notifications) {
            const list = $('#notification-list');
            list.empty();

            if (notifications.length === 0) {
                list.append($('<div>').addClass('empty-message').text('通知はありません。'));
                return;
            }

            notifications.forEach(notification => {
                const item = $('<div>')
                    .addClass('notification-item')
                    .toggleClass('unread', notification.readStatus === 0)
                    .attr('data-id', notification.id)
                    .attr('data-song-id', notification.songId || '');

                item.append($('<div>').addClass('notification-message').text(notification.message));
                item.append($('<small>').addClass('text-muted').text(formatDate(notification.createdDate)));
                list.append(item);
            });
        }

        function loadNotifications() {
            $.get('/api/notifications', renderNotifications)
                .fail(() => {
                    $('#notification-list').empty().append(
                        $('<div>').addClass('empty-message').text('通知の取得に失敗しました。')
                    );
                });
        }

        $('#notification-list').on('click', '.notification-item', function () {
            const item = $(this);
            const id = item.data('id');
            const songId = item.data('song-id');
            $.post(`/api/notifications/${id}/read`)
                .always(() => {
                    if (songId) {
                        location.href = `/song/detail/${songId}`;
                    } else {
                        item.removeClass('unread');
                    }
                });
        });

        $('#read-all-button').on('click', function () {
            const button = $(this);
            button.prop('disabled', true);
            $.post('/api/notifications/read-all')
                .done(loadNotifications)
                .always(() => button.prop('disabled', false));
        });

        loadNotifications();
    });
</script>
</body>
</html>
