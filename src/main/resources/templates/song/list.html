<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>曲一覧</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .song-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }
        .song-tag {
            border: 1px solid #0d6efd;
            border-radius: 999px;
            color: #0d6efd;
            background-color: #ffffff;
            padding: 0.15rem 0.5rem;
            font-size: 0.85rem;
            text-decoration: none;
            white-space: nowrap;
        }
        .song-tag:hover {
            background-color: #e7f1ff;
            color: #0a58ca;
        }
    </style>
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <button onclick="location.href='/member/mypage'" class="btn btn-outline-primary">マイページ</button>
        <button onclick="location.href='/timeline'" class="btn btn-outline-primary">タイムライン</button>
        <button onclick="location.href='/ranking'" class="btn btn-outline-primary">ランキング</button>
        <button onclick="location.href='/song/register'" class="btn btn-outline-primary">曲の新規作成</button>
        <button onclick="location.href='/introduction'" class="btn btn-outline-primary">使い方一覧</button>
        <button onclick="location.href='/notifications'" class="btn btn-outline-primary">
            通知 <span class="badge text-bg-danger notification-unread-count d-none">0</span>
        </button>
        <button id="logout" class="btn btn-outline-danger">ログアウト</button>
    </div>
    <div id="message" class="text-success" th:text="${message}"></div>
</div>

<div class="card p-3 mb-4">
    <form id="search-form" class="row g-2">
        <div class="col-md-4">
            <input type="text" name="title" class="form-control" placeholder="曲名" />
        </div>
        <div class="col-md-4">
            <input type="text" name="creater" class="form-control" placeholder="作曲者" />
        </div>
        <div class="col-md-3">
            <input type="text" name="tag" class="form-control" placeholder="タグ" />
        </div>
        <div class="col-md-1">
            <button type="submit" class="btn btn-primary">検索</button>
        </div>
    </form>
</div>

<table class="table table-bordered">
    <thead class="table-light">
    <tr>
        <th>曲名</th><th>作曲者</th><th>説明</th><th>タグ</th><th>BPM</th><th>拍子</th><th>いいね</th><th>コメント</th><th></th>
    </tr>
    </thead>
    <tbody id="song-body">
    </tbody>
</table>

<script>
    $(function() {
        let currentPage = 1;
        const pageSize = 10;
        const initialParams = new URLSearchParams(location.search);

        $("input[name='title']").val(initialParams.get('title') || '');
        $("input[name='creater']").val(initialParams.get('creater') || '');
        $("input[name='tag']").val(initialParams.get('tag') || '');

        function currentSearchParams() {
            return {
                title: $("input[name='title']").val(),
                creater: $("input[name='creater']").val(),
                tag: $("input[name='tag']").val()
            };
        }

        function renderTags(tags) {
            if (!tags || tags.length === 0) return '';
            const tagLinks = tags.map(tag => {
                const encoded = encodeURIComponent(tag.tagName);
                return `<a class="song-tag" href="/song/list?tag=${encoded}">#${tag.tagName}</a>`;
            }).join('');
            return `<div class="song-tags">${tagLinks}</div>`;
        }

        function loadSongs(params = {}) {
            params.page = currentPage;
            params.size = pageSize;
            $.get("/api/song/list", params, function(data) {
                const body = $("#song-body");
                body.empty();
                data.songs.forEach(song => {
                    body.append(`
                    <tr>
                        <td>${song.songTitle}</td>
                        <td>${song.createrName}</td>
                        <td>${song.songNote}</td>
                        <td>${renderTags(song.tags)}</td>
                        <td>${song.bpm}</td>
                        <td>${song.beatName}</td>
                        <td>♥ ${song.likeCount}</td>
                        <td>${song.commentCount}</td>
                        <td><button class="btn btn-sm btn-outline-secondary" onclick="location.href='/song/detail/${song.id}'">詳細</button></td>
                    </tr>
                `);
                });
                renderPagination(data.totalCount);
            });
        }

        function renderPagination(totalCount) {
            const totalPages = Math.ceil(totalCount / pageSize);
            const pagination = $('#pagination');
            pagination.empty();
            for (let i = 1; i <= totalPages; i++) {
                const btn = $(`<button class='btn btn-sm ${i === currentPage ? "btn-primary" : "btn-outline-secondary"} me-1'>${i}</button>`);
                btn.click(() => {
                    currentPage = i;
                    loadSongs(currentSearchParams());
                });
                pagination.append(btn);
            }
        }

        loadSongs(currentSearchParams());
        loadUnreadNotificationCount();

        $("#search-form").submit(function(e) {
            e.preventDefault();
            currentPage = 1;
            loadSongs(currentSearchParams());
        });

        $("#logout").click(function() {
            $.post("/api/member/logout", () => location.href = "/");
        });

        function loadUnreadNotificationCount() {
            $.get('/api/notifications/unread-count', function(data) {
                const badge = $('.notification-unread-count');
                badge.text(data.count);
                badge.toggleClass('d-none', data.count === 0);
            });
        }
    });
</script>
<div id="pagination" class="mt-3"></div>
</body>
</html>
