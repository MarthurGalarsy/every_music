<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>演奏録音</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .recording-container {
            max-width: 1180px;
            margin: 32px auto;
            padding: 0 16px 40px;
        }
        .page-header {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 22px;
            margin-bottom: 18px;
        }
        .page-title {
            font-weight: 700;
            margin-bottom: 8px;
        }
        .song-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .meta-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #ced4da;
            border-radius: 999px;
            padding: 6px 12px;
            background-color: #f8f9fa;
            color: #343a40;
            font-size: 0.9rem;
        }
        .recording-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(360px, 440px);
            gap: 18px;
            align-items: start;
        }
        .panel {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
        }
        .panel + .panel {
            margin-top: 18px;
        }
        .panel-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .form-control, .form-select {
            border-radius: 8px;
        }
        .section-block {
            padding: 15px;
            border-left: 4px solid #198754;
            margin-bottom: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }
        .chord-box {
            display: inline-block;
            margin-right: 15px;
            padding: 8px 12px;
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .recording-status {
            min-height: 3rem;
        }
        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .control-group .btn {
            min-width: 9rem;
        }
        .recording-action {
            min-height: 3rem;
        }
        .hint-list {
            margin-bottom: 0;
            padding-left: 1.1rem;
            color: #495057;
        }
        @media (max-width: 900px) {
            .recording-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="recording-container">
    <div class="page-header">
        <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
            <div>
                <h2 class="page-title" th:text="${song.title} + ' の演奏録音'"></h2>
                <div class="text-muted mb-3" th:text="${song.note}"></div>
                <div class="song-meta">
                    <span class="meta-badge"><strong>BPM</strong><span th:text="${song.bpm}"></span></span>
                    <span class="meta-badge"><strong>拍子</strong><span th:text="${song.beat}"></span></span>
                </div>
            </div>
            <a class="btn btn-outline-secondary" th:href="@{'/song/detail/' + ${song.id}}">曲詳細へ戻る</a>
        </div>
    </div>

    <div class="recording-grid">
        <div>
            <section class="panel">
                <h4 class="panel-title">曲構成</h4>
                <div th:each="structure : ${structures}" class="section-block">
                    <h5 th:text="${structure.sectionName}" class="mb-3"></h5>
                    <div>
                        <div th:each="chord : ${structure.chords}" class="chord-box">
                            <div th:text="'コード: ' + ${chord.chord}"></div>
                            <div th:text="'小節数: ' + ${chord.measureNum}"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel">
                <h4 class="panel-title">録音時のポイント</h4>
                <ul class="hint-list">
                    <li>メトロノームは曲のBPMに合わせて鳴ります。</li>
                    <li>伴奏を選んで録音画面へ来た場合は、録音開始と同時に再生されます。</li>
                    <li>スピーカーの音をマイクが拾う場合はヘッドホンを使うと録音しやすくなります。</li>
                </ul>
            </section>
        </div>

        <div>
            <input type="hidden" id="playUrls" th:value="${#strings.arrayJoin(selectedUrls, ',')}" />
            <form id="record-form">
                <input type="hidden" name="songId" th:value="${song.id}" />

                <section class="panel">
                    <h4 class="panel-title">録音設定</h4>
                    <div class="mb-3">
                        <label class="form-label">楽器</label>
                        <select class="form-select" name="instrumentId">
                            <option th:each="ins : ${instruments}" th:value="${ins.id}" th:text="${ins.name}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">演奏タイトル</label>
                        <input type="text" class="form-control" name="playTitle" required>
                    </div>

                    <div class="mb-0">
                        <label class="form-label">説明</label>
                        <input type="text" class="form-control" name="playNote" required>
                    </div>
                </section>

                <section class="panel">
                    <h4 class="panel-title">メトロノーム</h4>
                    <div class="mb-3">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="recording-click" checked>
                            <label class="form-check-label" for="recording-click">録音中にメトロノームを鳴らす</label>
                        </div>
                        <div class="control-group">
                            <button type="button" id="start-metronome" class="btn btn-outline-dark">メトロノーム再生</button>
                            <button type="button" id="stop-metronome" class="btn btn-outline-secondary" disabled>停止</button>
                        </div>
                    </div>
                    <div class="song-meta">
                        <span class="meta-badge"><strong>BPM</strong><span th:text="${song.bpm}"></span></span>
                        <span class="meta-badge"><strong>拍子</strong><span th:text="${song.beat}"></span></span>
                    </div>
                </section>

                <section class="panel">
                    <h4 class="panel-title">録音操作</h4>
                    <div class="control-group mb-3">
                        <button type="button" id="start-record" class="btn btn-primary recording-action">録音開始</button>
                        <button type="button" id="stop-record" class="btn btn-outline-secondary recording-action" disabled>録音停止</button>
                    </div>
                    <div class="control-group mb-3">
                        <button type="button" id="play-preview" class="btn btn-outline-success" disabled>プレビュー再生</button>
                        <button type="button" id="stop-preview" class="btn btn-outline-secondary" disabled>プレビュー停止</button>
                    </div>

                    <div id="recording-status" class="alert alert-info recording-status">
                        メトロノームを確認してから録音できます。録音開始後は1小節カウントしてから演奏してください。
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success" id="upload-button" disabled>投稿</button>
                        <a class="btn btn-outline-secondary" th:href="@{'/song/detail/' + ${song.id}}">戻る</a>
                    </div>
                </section>
            </form>
            <div id="error-message" class="alert alert-danger mt-3 d-none"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
<script th:inline="javascript">
    const songBpm = Number([[${song.bpm}]]);
    const songBeat = [[${song.beat}]];
</script>
<script>
    let audioContext;
    let workletLoaded = false;
    let audioData = [];
    let recorderNode;
    let gainNode;
    let silentNode;
    let stream;
    let micSource;
    let mp3Blob;
    let audioUrl;
    let audio;
    let accompSources = [];
    let accompBuffers = [];
    let metronomeTimer;
    let nextClickTime = 0;
    let clickIndex = 0;
    let metronomeStopBeat = null;
    let recordingActive = false;

    function showStatus(message, type = "info") {
        $("#recording-status")
            .removeClass("alert-info alert-success alert-warning alert-danger")
            .addClass(`alert-${type}`)
            .text(message);
    }

    function showError(message) {
        $("#error-message").text(message).removeClass("d-none");
        showStatus(message, "danger");
    }

    function clearError() {
        $("#error-message").addClass("d-none").text("");
    }

    function getBeatsPerMeasure() {
        const match = String(songBeat || "").match(/^(\d+)\/\d+/);
        return match ? Number(match[1]) : 4;
    }

    function getSecondsPerBeat() {
        return 60 / songBpm;
    }

    async function ensureAudioContext() {
        if (!audioContext || audioContext.state === "closed") {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
            workletLoaded = false;
        }
        if (audioContext.state === "suspended") {
            await audioContext.resume();
        }
        if (!workletLoaded) {
            await audioContext.audioWorklet.addModule('/js/recorder-worklet.js');
            workletLoaded = true;
        }
        return audioContext;
    }

    function scheduleClick(time, accented) {
        const oscillator = audioContext.createOscillator();
        const clickGain = audioContext.createGain();
        oscillator.frequency.value = accented ? 1200 : 820;
        clickGain.gain.setValueAtTime(0.0001, time);
        clickGain.gain.exponentialRampToValueAtTime(accented ? 0.55 : 0.35, time + 0.005);
        clickGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.07);
        oscillator.connect(clickGain);
        clickGain.connect(audioContext.destination);
        oscillator.start(time);
        oscillator.stop(time + 0.08);
    }

    function startMetronomeAt(startTime, totalBeats = null) {
        stopMetronome();
        const beatsPerMeasure = getBeatsPerMeasure();
        const secondsPerBeat = getSecondsPerBeat();
        nextClickTime = startTime;
        clickIndex = 0;
        metronomeStopBeat = totalBeats;

        metronomeTimer = window.setInterval(() => {
            while (nextClickTime < audioContext.currentTime + 0.15) {
                if (metronomeStopBeat !== null && clickIndex >= metronomeStopBeat) {
                    stopMetronome();
                    return;
                }
                scheduleClick(nextClickTime, clickIndex % beatsPerMeasure === 0);
                nextClickTime += secondsPerBeat;
                clickIndex += 1;
            }
        }, 25);

        $("#start-metronome").prop("disabled", true);
        $("#stop-metronome").prop("disabled", false);
    }

    function stopMetronome() {
        if (metronomeTimer) {
            window.clearInterval(metronomeTimer);
            metronomeTimer = null;
        }
        $("#start-metronome").prop("disabled", false);
        $("#stop-metronome").prop("disabled", true);
    }

    async function loadAccompaniment() {
        accompBuffers = [];
        const urls = ($('#playUrls').val() || '').split(',').filter(x => x);
        for (const url of urls) {
            const audioUrl = await resolveAudioUrl(url);
            const res = await fetch(audioUrl);
            if (!res.ok) throw new Error("伴奏音源の取得に失敗しました");
            const buf = await res.arrayBuffer();
            const audioBuf = await audioContext.decodeAudioData(buf);
            accompBuffers.push(audioBuf);
        }
    }

    async function resolveAudioUrl(value) {
        if (/^https?:\/\//.test(value)) return value;

        const res = await fetch('/api/song/url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: value })
        });
        if (!res.ok) throw new Error("伴奏音源のURL取得に失敗しました");
        const { url } = await res.json();
        return url;
    }

    function startAccompaniment(startTime) {
        stopAccompaniment();
        accompSources = accompBuffers.map(audioBuf => {
            const source = audioContext.createBufferSource();
            source.buffer = audioBuf;
            source.connect(audioContext.destination);
            source.start(startTime);
            return source;
        });
    }

    function stopAccompaniment() {
        for (const source of accompSources) {
            try { source.stop(); } catch (_) {}
        }
        accompSources = [];
    }

    function floatTo16BitPCM(float32Array) {
        const int16Array = new Int16Array(float32Array.length);
        for (let i = 0; i < float32Array.length; i++) {
            let s = Math.max(-1, Math.min(1, float32Array[i]));
            int16Array[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return int16Array;
    }

    function cleanupRecorder() {
        recordingActive = false;
        if (micSource) {
            try { micSource.disconnect(); } catch (_) {}
            micSource = null;
        }
        if (gainNode) {
            try { gainNode.disconnect(); } catch (_) {}
            gainNode = null;
        }
        if (recorderNode) {
            try { recorderNode.disconnect(); } catch (_) {}
            recorderNode = null;
        }
        if (silentNode) {
            try { silentNode.disconnect(); } catch (_) {}
            silentNode = null;
        }
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
    }

    function buildMp3Blob() {
        const totalLength = audioData.reduce((sum, a) => sum + a.length, 0);
        if (totalLength === 0) {
            throw new Error("録音データがありません");
        }

        const flat = new Float32Array(totalLength);
        let offset = 0;
        for (const chunk of audioData) {
            flat.set(chunk, offset);
            offset += chunk.length;
        }

        const sampleRate = audioContext.sampleRate || 44100;
        const int16Samples = floatTo16BitPCM(flat);
        const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
        const blockSize = 1152;
        const mp3Data = [];

        for (let i = 0; i < int16Samples.length; i += blockSize) {
            const chunk = int16Samples.subarray(i, i + blockSize);
            const mp3buf = mp3encoder.encodeBuffer(chunk);
            if (mp3buf.length > 0) mp3Data.push(mp3buf);
        }

        const end = mp3encoder.flush();
        if (end.length > 0) mp3Data.push(end);

        return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    $("#start-record").on("click", async function () {
        clearError();
        try {
            await ensureAudioContext();
            stopMetronome();
            stopAccompaniment();
            cleanupRecorder();
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
            }
            if (audioUrl) {
                URL.revokeObjectURL(audioUrl);
            }
            mp3Blob = null;
            audioUrl = null;
            audio = null;
            audioData = [];

            showStatus("マイクを準備しています。ブラウザの許可が出たら許可してください。", "info");
            stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                }
            });

            showStatus("伴奏音源を準備しています。", "info");
            await loadAccompaniment();

            micSource = audioContext.createMediaStreamSource(stream);
            gainNode = audioContext.createGain();
            gainNode.gain.value = 1.5;
            recorderNode = new AudioWorkletNode(audioContext, 'recorder-processor');
            silentNode = audioContext.createGain();
            silentNode.gain.value = 0;

            recorderNode.port.onmessage = e => {
                if (!recordingActive) return;
                audioData.push(new Float32Array(e.data));
            };

            micSource.connect(gainNode);
            gainNode.connect(recorderNode);
            recorderNode.connect(silentNode);
            silentNode.connect(audioContext.destination);

            const beatsPerMeasure = getBeatsPerMeasure();
            const startTime = audioContext.currentTime + 0.2;
            const clickBeats = $("#recording-click").prop("checked") ? null : beatsPerMeasure;
            window.setTimeout(() => {
                recordingActive = true;
            }, Math.max(0, (startTime - audioContext.currentTime) * 1000));

            startMetronomeAt(startTime, clickBeats);
            startAccompaniment(startTime);

            $("#start-record, #start-metronome").prop("disabled", true);
            $("#stop-record").prop("disabled", false);
            $("#play-preview, #upload-button").prop("disabled", true);
            showStatus(`${beatsPerMeasure}拍カウント後に演奏を開始してください。録音中です。`, "warning");
        } catch (e) {
            console.error(e);
            stopMetronome();
            stopAccompaniment();
            cleanupRecorder();
            $("#start-record").prop("disabled", false);
            $("#stop-record").prop("disabled", true);
            showError(e.message || "録音開始に失敗しました。");
        }
    });

    $("#stop-record").on("click", function () {
        stopAccompaniment();
        stopMetronome();
        try {
            recordingActive = false;
            cleanupRecorder();
            mp3Blob = buildMp3Blob();
            audioUrl = URL.createObjectURL(mp3Blob);
            audio = new Audio(audioUrl);

            $("#play-preview, #upload-button").prop("disabled", false);
            $("#stop-preview").prop("disabled", true);
            $("#stop-record").prop("disabled", true);
            $("#start-record, #start-metronome").prop("disabled", false);
            showStatus("録音が完了しました。プレビュー確認後に投稿できます。", "success");
        } catch (e) {
            console.error(e);
            $("#play-preview, #upload-button, #stop-preview").prop("disabled", true);
            $("#stop-record").prop("disabled", true);
            $("#start-record, #start-metronome").prop("disabled", false);
            showError(e.message || "録音データの作成に失敗しました。");
        }
    });

    $("#play-preview").on("click", function () {
        if (audio) {
            audio.play();
            $("#stop-preview").prop("disabled", false);
        }
    });

    $("#stop-preview").on("click", function () {
        if (audio) {
            audio.pause();
            audio.currentTime = 0;
        }
        $("#stop-preview").prop("disabled", true);
    });

    $("#start-metronome").on("click", async function () {
        clearError();
        try {
            await ensureAudioContext();
            startMetronomeAt(audioContext.currentTime + 0.05);
            showStatus(`${songBpm} BPM / ${songBeat} でメトロノームを再生中です。`, "info");
        } catch (e) {
            console.error(e);
            showError(e.message || "メトロノーム再生に失敗しました。");
        }
    });

    $("#stop-metronome").on("click", function () {
        stopMetronome();
        showStatus("メトロノームを停止しました。", "info");
    });

    $("#record-form").on("submit", function (e) {
        e.preventDefault();
        clearError();
        if (!mp3Blob) {
            showError("録音してから投稿してください。");
            return;
        }
        const formData = new FormData(this);
        formData.append("file", mp3Blob, "recorded.mp3");
        $.ajax({
            url: "/api/song/play/upload",
            type: "POST",
            data: formData,
            processData: false,
            contentType: false
        }).done(data => {
            window.location.href = data.redirect;
        }).fail(err => {
            $("#error-message").text(err.responseJSON?.message || "アップロードに失敗しました").removeClass("d-none");
        });
    });
</script>
</body>
</html>
