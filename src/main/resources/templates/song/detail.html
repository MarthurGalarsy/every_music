<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/seo :: meta(${seoTitle}, ${seoDescription}, 'music.song', ${seoUrl})}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app-header.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .section-block {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .page-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .page-actions .btn {
            white-space: nowrap;
        }
        .chord-box {
            display: inline-block;
            background-color: #e9ecef;
            padding: 10px;
            margin: 5px;
            border-radius: 6px;
            font-size: 14px;
        }
        .instrument-column {
            min-width: 300px;
            max-width: 100%;
        }
        .instrument-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
         .instrument-column {
             min-width: 280px;
             max-width: 100%;
         }
        .scroll-box {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .interaction-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            margin-top: 0.75rem;
        }
        .interaction-button {
            min-width: 5.75rem;
        }
        .like-button .heart {
            color: #6c757d;
            font-size: 1.05rem;
            line-height: 1;
        }
        .like-button.liked .heart {
            color: #dc3545;
        }
        .comment-list {
            max-height: 320px;
            overflow-y: auto;
        }
        .comment-item {
            border-bottom: 1px solid #e9ecef;
            padding: 0.75rem 0;
        }
        .comment-item:last-child {
            border-bottom: none;
        }
        .comment-text {
            white-space: pre-wrap;
            word-break: break-word;
        }
        .recruitment-list {
            display: grid;
            gap: 0.75rem;
        }
        .recruitment-item {
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 0.75rem;
            background-color: #ffffff;
        }
        .recruitment-note {
            white-space: pre-wrap;
            word-break: break-word;
        }
        .recruitment-row {
            border-bottom: 1px solid #e9ecef;
            padding: 0.75rem 0;
        }
        .recruitment-row:last-child {
            border-bottom: none;
        }
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .song-tag {
            border: 1px solid #0d6efd;
            border-radius: 999px;
            color: #0d6efd;
            background-color: #ffffff;
            padding: 0.25rem 0.65rem;
            font-size: 0.9rem;
            text-decoration: none;
        }
        .song-tag:hover {
            background-color: #e7f1ff;
            color: #0a58ca;
        }
        @media (max-width: 576px) {
            body.container {
                padding-left: 12px;
                padding-right: 12px;
            }
            .page-header {
                align-items: stretch !important;
                flex-direction: column;
                gap: 0.75rem;
            }
            .page-actions {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
            }
            .page-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body class="container mt-4">
<div class="page-header d-flex justify-content-between align-items-center mb-3">
    <div class="page-title-block">
        <div class="app-brand">みんなで音楽！Every Music</div>
        <h1 class="h2 mb-0">曲詳細</h1>
    </div>
    <div class="page-actions">
        <button onclick="location.href='/member/mypage'" class="btn btn-outline-primary">マイページ</button>
        <button onclick="location.href='/song/list'" class="btn btn-outline-primary">曲一覧</button>
        <button onclick="location.href='/timeline'" class="btn btn-outline-primary">タイムライン</button>
        <button onclick="location.href='/ranking'" class="btn btn-outline-primary">ランキング</button>
        <button onclick="location.href='/introduction'" class="btn btn-outline-primary">使い方一覧</button>
        <button onclick="location.href='/notifications'" class="btn btn-outline-primary">
            通知 <span class="badge text-bg-danger notification-unread-count d-none">0</span>
        </button>
        <button id="logout" class="btn btn-outline-danger">ログアウト</button>
    </div>
</div>
<h2 class="mb-3" th:text="${song.title}"></h2>
<div class="mb-3">
    <strong>作曲者:</strong>
    <span th:text="${song.creater}"></span>
    <button type="button"
            class="btn btn-sm follow-button ms-2"
            th:if="${song.canFollowCreator}"
            th:classappend="${song.followingCreator} ? ' btn-primary' : ' btn-outline-primary'"
            th:attr="data-member-id=${song.createrId},data-following=${song.followingCreator}">
        <span th:text="${song.followingCreator} ? 'フォロー中' : 'フォロー'"></span>
    </button><br />
    <strong>説明:</strong> <span th:text="${song.note}"></span><br />
    <strong>BPM:</strong> <span th:text="${song.bpm}"></span><br />
    <strong>拍子:</strong> <span th:text="${song.beat}"></span>
    <div class="interaction-actions">
        <button type="button"
                class="btn btn-sm btn-outline-secondary interaction-button like-button"
                th:classappend="${song.liked} ? ' liked' : ''"
                th:attr="data-target-id=${song.id},aria-pressed=${song.liked}"
                data-target-type="song">
            <span class="heart">♥</span>
            <span class="like-count" th:text="${song.likeCount}"></span>
        </button>
        <button type="button"
                class="btn btn-sm btn-outline-secondary interaction-button comment-button"
                th:attr="data-target-id=${song.id},data-target-title=${song.title}"
                data-target-type="song"
                >
            コメント
            <span class="comment-count" th:text="${song.commentCount}"></span>
        </button>
    </div>
</div>

<div class="section-block">
    <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
        <h4 class="mb-0">タグ</h4>
        <button type="button"
                class="btn btn-sm btn-outline-primary"
                data-bs-toggle="modal"
                data-bs-target="#tag-modal"
                th:if="${canEditTags}">
            タグ編集
        </button>
    </div>
    <div id="tag-list" class="tag-list"></div>
</div>

<div class="section-block">
    <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
        <h4 class="mb-0">演奏募集</h4>
        <button type="button"
                class="btn btn-sm btn-outline-primary"
                data-bs-toggle="modal"
                data-bs-target="#recruitment-modal"
                th:if="${canEditRecruitments}">
            募集内容を編集
        </button>
    </div>
    <div id="recruitment-list" class="recruitment-list"></div>
</div>

<h4 class="mt-4">曲構成</h4>
<div th:each="structure : ${structures}" class="section-block">
    <h5 th:text="${structure.sectionName}" class="mb-3"></h5>
    <div>
        <div th:each="chord : ${structure.chords}" class="chord-box">
            <div th:text="'コード: ' + ${chord.chord}"></div>
            <div th:text="'小節数: ' + ${chord.measureNum}"></div>
        </div>
    </div>
</div>

<h4 class="mt-4">演奏</h4>
<form id="play-form" class="instrument-wrapper">
    <div th:each="entry : ${instruments}" class="instrument-column">
        <strong class="d-block mb-2" th:text="${entry.key.name}"></strong>
        <div class="scroll-box">
            <div class="ms-2" th:each="play : ${entry.value}" style="margin-bottom: 1rem;">
                <label class="form-check-label d-block">
                    <input type="radio" class="form-check-input me-2" th:name="'instrument_' + ${entry.key.id}" th:attr="value=${play.audioUrl}" />
                    <span th:text="${play.title}"></span>
                </label>
                <small class="text-muted d-block" th:text="${play.note}"></small>
                <small class="d-block fst-italic">
                    演奏者: <span th:text="${play.playerName}"></span>
                    <button type="button"
                            class="btn btn-sm follow-button ms-2"
                            th:if="${play.canFollowPlayer}"
                            th:classappend="${play.followingPlayer} ? ' btn-primary' : ' btn-outline-primary'"
                            th:attr="data-member-id=${play.playerId},data-following=${play.followingPlayer}">
                        <span th:text="${play.followingPlayer} ? 'フォロー中' : 'フォロー'"></span>
                    </button>
                </small>
                <div class="interaction-actions">
                    <button type="button"
                            class="btn btn-sm btn-outline-secondary interaction-button like-button"
                            th:classappend="${play.liked} ? ' liked' : ''"
                            th:attr="data-target-id=${play.id},aria-pressed=${play.liked}"
                            data-target-type="play">
                        <span class="heart">♥</span>
                        <span class="like-count" th:text="${play.likeCount}"></span>
                    </button>
                    <button type="button"
                            class="btn btn-sm btn-outline-secondary interaction-button comment-button"
                            th:attr="data-target-id=${play.id},data-target-title=${play.title}"
                            data-target-type="play"
                            >
                        コメント
                        <span class="comment-count" th:text="${play.commentCount}"></span>
                    </button>
                </div>
                <audio controls th:src="@{${play.audioUrl}}" class="mt-2 w-100"></audio>
            </div>
        </div>
    </div>
</form>

<div class="d-flex gap-3 mt-4 mb-5">
    <button class="btn btn-primary" id="play-button">▶️ 再生</button>
    <button class="btn btn-danger" id="stop-button">⏹ 停止</button>
</div>
<div class="d-flex gap-3 mt-4 mb-5">
    <a th:href="@{'/song/register/copy/' + ${song.id}}" class="btn btn-outline-secondary">コピーして新規作成</a>
    <a th:href="@{'/song/play/upload/' + ${song.id}}" class="btn btn-outline-info">演奏投稿</a>
    <a href="/song/list" class="btn btn-outline-dark">戻る</a>
</div>
<form id="record-to-form" method="post" action="/song/recording/to">
    <input type="hidden" name="songId" th:value="${song.id}" />
    <div id="selected-urls-container"></div>
    <div class="d-flex align-items-center gap-3 flex-wrap">
        <span class="text-muted">画面上でメトロノームに合わせて録音できます。</span>
        <button type="submit" class="btn btn-outline-info">画面録音へ</button>
    </div>
</form>

<div class="modal fade" id="tag-modal" tabindex="-1" aria-hidden="true" th:if="${canEditTags}">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">タグ編集</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
            </div>
            <div class="modal-body">
                <label for="tag-input" class="form-label">タグ</label>
                <input type="text" id="tag-input" class="form-control" placeholder="ロック, 初心者歓迎, ボーカル募集">
                <div class="form-text" th:text="|カンマ区切りで${maxTagCount}個まで、1つ${maxTagLength}文字以内で入力できます。|">カンマ区切りで5個まで、1つ20文字以内で入力できます。</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">閉じる</button>
                <button type="button" class="btn btn-primary" id="save-tag-button">保存</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="recruitment-modal" tabindex="-1" aria-hidden="true" th:if="${canEditRecruitments}">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">募集内容を編集</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
            </div>
            <div class="modal-body">
                <div id="recruitment-editor"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">閉じる</button>
                <button type="button" class="btn btn-primary" id="save-recruitment-button">保存</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="comment-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="comment-modal-title">コメント</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
            </div>
            <div class="modal-body">
                <div id="comment-list" class="comment-list mb-3"></div>
                <label for="comment-input" class="form-label">あなたのコメント</label>
                <textarea id="comment-input" class="form-control" rows="4" th:attr="maxlength=${maxCommentLength}"></textarea>
                <div class="form-text text-end"><span id="comment-length">0</span>/<span th:text="${maxCommentLength}">1000</span></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">閉じる</button>
                <button type="button" class="btn btn-primary" id="save-comment-button">保存</button>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const detailSongId = /*[[${song.id}]]*/ 0;
    const initialRecruitments = /*[[${recruitments}]]*/ [];
    const allRecruitmentInstruments = /*[[${allInstruments}]]*/ [];
    const canEditRecruitments = /*[[${canEditRecruitments}]]*/ false;
    const initialTags = /*[[${tags}]]*/ [];
    const canEditTags = /*[[${canEditTags}]]*/ false;
    const maxTagCount = /*[[${maxTagCount}]]*/ 5;
    const maxTagLength = /*[[${maxTagLength}]]*/ 20;
    const maxRecruitmentNoteLength = /*[[${maxRecruitmentNoteLength}]]*/ 255;
</script>
<script>
    let audioContext;
    let sources = [];
    let currentCommentTarget = null;

    function targetBasePath(type, id) {
        return type === 'song' ? `/api/song/${id}` : `/api/song/play/${id}`;
    }

    function renderRecruitmentList(recruitments) {
        const list = $('#recruitment-list');
        list.empty();

        if (!recruitments || recruitments.length === 0) {
            list.append($('<div>').addClass('text-muted').text('現在募集中のパートはありません。'));
            return;
        }

        recruitments.forEach(recruitment => {
            const item = $('<div>').addClass('recruitment-item');
            item.append($('<strong>').text(recruitment.instrumentName));
            if (recruitment.note) {
                item.append($('<div>').addClass('recruitment-note text-muted mt-1').text(recruitment.note));
            }
            list.append(item);
        });
    }

    function renderTagList(tags) {
        const list = $('#tag-list');
        list.empty();

        if (!tags || tags.length === 0) {
            list.append($('<div>').addClass('text-muted').text('タグはまだありません。'));
            return;
        }

        tags.forEach(tag => {
            const link = $('<a>')
                .addClass('song-tag')
                .attr('href', `/song/list?tag=${encodeURIComponent(tag.tagName)}`)
                .text(`#${tag.tagName}`);
            list.append(link);
        });
    }

    function parseTags(value) {
        return value
            .split(',')
            .map(tag => tag.trim())
            .filter(tag => tag.length > 0)
            .filter((tag, index, tags) => tags.indexOf(tag) === index);
    }

    function renderRecruitmentEditor(recruitments) {
        const editor = $('#recruitment-editor');
        if (editor.length === 0) return;

        editor.empty();
        const recruitmentByInstrument = new Map((recruitments || []).map(item => [Number(item.instrumentId), item]));

        if (!allRecruitmentInstruments || allRecruitmentInstruments.length === 0) {
            editor.append($('<div>').addClass('text-muted').text('楽器が登録されていません。'));
            return;
        }

        allRecruitmentInstruments.forEach(instrument => {
            const instrumentId = Number(instrument.id);
            const current = recruitmentByInstrument.get(instrumentId);
            const row = $('<div>').addClass('recruitment-row');
            const checkWrapper = $('<div>').addClass('form-check mb-2');
            const checkbox = $('<input>')
                .addClass('form-check-input recruitment-checkbox')
                .attr('type', 'checkbox')
                .attr('id', `recruitment-${instrumentId}`)
                .attr('data-instrument-id', instrumentId)
                .prop('checked', !!current);
            const label = $('<label>')
                .addClass('form-check-label fw-semibold')
                .attr('for', `recruitment-${instrumentId}`)
                .text(instrument.name);
            const note = $('<input>')
                .addClass('form-control form-control-sm recruitment-note-input')
                .attr('type', 'text')
                .attr('maxlength', maxRecruitmentNoteLength)
                .attr('placeholder', '募集コメント')
                .val(current ? current.note : '')
                .prop('disabled', !current);

            checkWrapper.append(checkbox, label);
            row.append(checkWrapper, note);
            editor.append(row);
        });
    }

    function collectRecruitmentEditorValues() {
        return $('#recruitment-editor .recruitment-row').map(function () {
            const row = $(this);
            const checkbox = row.find('.recruitment-checkbox');
            if (!checkbox.is(':checked')) return null;
            return {
                instrumentId: Number(checkbox.data('instrument-id')),
                note: row.find('.recruitment-note-input').val().trim()
            };
        }).get();
    }

    function applySummary(type, id, summary) {
        const selector = `[data-target-type="${type}"][data-target-id="${id}"]`;
        const likeButton = $(`.like-button${selector}`);
        likeButton.toggleClass('liked', summary.liked);
        likeButton.attr('aria-pressed', summary.liked);
        likeButton.find('.like-count').text(summary.likeCount);
        $(`.comment-button${selector}`).find('.comment-count').text(summary.commentCount);
    }

    function applyFollowSummary(memberId, summary) {
        $(`.follow-button[data-member-id="${memberId}"]`).each(function () {
            const button = $(this);
            button.attr('data-following', summary.following);
            button.toggleClass('btn-primary', summary.following);
            button.toggleClass('btn-outline-primary', !summary.following);
            button.find('span').text(summary.following ? 'フォロー中' : 'フォロー');
        });
    }

    renderRecruitmentList(initialRecruitments);
    renderRecruitmentEditor(initialRecruitments);
    renderTagList(initialTags);
    $('#tag-input').val((initialTags || []).map(tag => tag.tagName).join(', '));
    loadUnreadNotificationCount();

    function loadUnreadNotificationCount() {
        $.get('/api/notifications/unread-count', function(data) {
            const badge = $('.notification-unread-count');
            badge.text(data.count);
            badge.toggleClass('d-none', data.count === 0);
        });
    }

    $('#recruitment-editor').on('change', '.recruitment-checkbox', function () {
        const row = $(this).closest('.recruitment-row');
        row.find('.recruitment-note-input').prop('disabled', !$(this).is(':checked'));
    });

    $('#save-recruitment-button').on('click', function () {
        if (!canEditRecruitments) return;

        const button = $(this);
        button.prop('disabled', true);
        $.ajax({
            url: `/api/song/${detailSongId}/recruitments`,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ recruitments: collectRecruitmentEditorValues() })
        })
            .done(recruitments => {
                renderRecruitmentList(recruitments);
                renderRecruitmentEditor(recruitments);
                bootstrap.Modal.getOrCreateInstance(document.getElementById('recruitment-modal')).hide();
            })
            .fail(xhr => {
                const message = xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : '募集内容の保存に失敗しました。';
                alert(message);
            })
            .always(() => button.prop('disabled', false));
    });

    $('#save-tag-button').on('click', function () {
        if (!canEditTags) return;

        const tags = parseTags($('#tag-input').val());
        if (tags.length > maxTagCount) {
            alert(`タグは${maxTagCount}個以内で入力してください。`);
            return;
        }
        if (tags.some(tag => tag.length > maxTagLength)) {
            alert(`タグは${maxTagLength}文字以内で入力してください。`);
            return;
        }

        const button = $(this);
        button.prop('disabled', true);
        $.ajax({
            url: `/api/song/${detailSongId}/tags`,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ tags })
        })
            .done(savedTags => {
                renderTagList(savedTags);
                $('#tag-input').val(savedTags.map(tag => tag.tagName).join(', '));
                bootstrap.Modal.getOrCreateInstance(document.getElementById('tag-modal')).hide();
            })
            .fail(xhr => {
                const message = xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : 'タグの保存に失敗しました。';
                alert(message);
            })
            .always(() => button.prop('disabled', false));
    });

    $('.follow-button').on('click', function () {
        const button = $(this);
        const memberId = button.data('member-id');
        button.prop('disabled', true);

        $.post(`/api/members/${memberId}/follow`)
            .done(summary => applyFollowSummary(memberId, summary))
            .fail(xhr => {
                const message = xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : 'フォローの更新に失敗しました。';
                alert(message);
            })
            .always(() => button.prop('disabled', false));
    });

    function renderComments(comments) {
        const list = $('#comment-list');
        list.empty();
        $('#comment-input').val('');
        $('#comment-length').text('0');

        if (comments.length === 0) {
            list.append($('<div>').addClass('text-muted py-3').text('まだコメントはありません。'));
            return;
        }

        comments.forEach(comment => {
            if (comment.isMine) {
                $('#comment-input').val(comment.comment);
                $('#comment-length').text(comment.comment.length);
            }

            const item = $('<div>').addClass('comment-item');
            const header = $('<div>').addClass('d-flex justify-content-between gap-2 mb-1');
            const name = $('<strong>').text(comment.memberName + (comment.isMine ? '（あなた）' : ''));
            const date = $('<small>').addClass('text-muted').text((comment.createdDate || '').toString().replace('T', ' ').slice(0, 16));
            const text = $('<div>').addClass('comment-text').text(comment.comment);

            header.append(name, date);
            item.append(header, text);
            list.append(item);
        });
    }

    $('.like-button').on('click', function () {
        const button = $(this);
        const type = button.data('target-type');
        const id = button.data('target-id');
        button.prop('disabled', true);

        $.post(`${targetBasePath(type, id)}/like`)
            .done(summary => applySummary(type, id, summary))
            .fail(() => alert('いいねの更新に失敗しました。時間を置いてもう一度お試しください。'))
            .always(() => button.prop('disabled', false));
    });

    $('.comment-button').on('click', function () {
        const button = $(this);
        const type = button.data('target-type');
        const id = button.data('target-id');
        currentCommentTarget = { type, id };
        $('#comment-modal-title').text(`${button.data('target-title') || 'コメント'} のコメント`);

        $.get(`${targetBasePath(type, id)}/comments`)
            .done(comments => {
                renderComments(comments);
                bootstrap.Modal.getOrCreateInstance(document.getElementById('comment-modal')).show();
            })
            .fail(() => alert('コメントの取得に失敗しました。時間を置いてもう一度お試しください。'));
    });

    $('#comment-input').on('input', function () {
        $('#comment-length').text($(this).val().length);
    });

    $('#save-comment-button').on('click', function () {
        if (!currentCommentTarget) return;

        const comment = $('#comment-input').val().trim();
        if (!comment) {
            alert('コメントを入力してください。');
            return;
        }

        const button = $(this);
        button.prop('disabled', true);
        $.ajax({
            url: `${targetBasePath(currentCommentTarget.type, currentCommentTarget.id)}/comments`,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ comment })
        })
            .done(summary => {
                applySummary(currentCommentTarget.type, currentCommentTarget.id, summary);
                $.get(`${targetBasePath(currentCommentTarget.type, currentCommentTarget.id)}/comments`, renderComments);
            })
            .fail(xhr => {
                const message = xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : 'コメントの保存に失敗しました。';
                alert(message);
            })
            .always(() => button.prop('disabled', false));
    });

    $('#play-button').on('click', async function () {
        const urls = [];
        $('#play-form input[type=radio]:checked').each(function () {
            urls.push($(this).val());
        });

        if (urls.length === 0) {
            alert("演奏を1つ以上選択してください。");
            return;
        }

        // AudioContextを再生成（古いものが存在する場合は閉じる）
        if (audioContext) {
            try { audioContext.close(); } catch (_) {}
        }
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        sources = [];

        try {
            const buffers = await Promise.all(urls.map(async fullUrl => {
                // S3キーだけ抽出（例: uploads/xxx.mp3）
                const match = fullUrl.match(/uploads\/[^?"]+/);
                const key = match ? match[0] : null;
                if (!key) throw new Error("S3キーの抽出に失敗しました");

                const res = await fetch('/api/song/url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });

                if (!res.ok) throw new Error(`署名付きURL取得失敗: ${key}`);
                const { url } = await res.json();
                const audioRes = await fetch(url);
                const arrayBuffer = await audioRes.arrayBuffer();
                return await audioContext.decodeAudioData(arrayBuffer);
            }));

            const startTime = audioContext.currentTime + 0.1;
            buffers.forEach(buffer => {
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.start(startTime);
                sources.push(source);
            });
        } catch (e) {
            console.error("同期再生エラー:", e);
            alert("再生に失敗しました。時間を置いてもう一度お試しください。");
        }
    });

    $('#stop-button').on('click', function () {
        sources.forEach(src => {
            try { src.stop(); } catch (_) {}
        });
        sources = [];
        if (audioContext) {
            try { audioContext.close(); } catch (_) {}
            audioContext = null;
        }
    });

    document.getElementById("record-to-form").addEventListener("submit", function (e) {
        const container = document.getElementById("selected-urls-container");
        container.innerHTML = "";
        const checkedRadios = document.querySelectorAll("#play-form input[type=radio]:checked");
        checkedRadios.forEach(radio => {
            const fullUrl = radio.value;
            const match = fullUrl.match(/uploads\/[^?"]+/);
            const key = match ? match[0] : null;
            if (key) {
                const input = document.createElement("input");
                input.type = "hidden";
                input.name = "urls";
                input.value = key;
                container.appendChild(input);
            }
        });
    });
</script>
</body>
</html>
