<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="meta(pageTitle, description, ogType, canonicalUrl)">
    <title th:text="${pageTitle}">Every Music</title>
    <meta name="description" th:content="${description}">
    <link rel="canonical" th:href="${canonicalUrl}">
    <meta property="og:site_name" th:content="${siteName}">
    <meta property="og:title" th:content="${pageTitle}">
    <meta property="og:description" th:content="${description}">
    <meta property="og:type" th:content="${ogType}">
    <meta property="og:url" th:content="${canonicalUrl}">
    <meta property="og:image" th:content="${defaultOgImageUrl}">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#f39c12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Every Music">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/images/pwa-icon.svg">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/service-worker.js').catch(function () {});
            });
        }
    </script>
</th:block>
</body>
</html>
